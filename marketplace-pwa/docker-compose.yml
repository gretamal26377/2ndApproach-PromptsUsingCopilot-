# filepath: marketplace-pwa/docker-compose.yml
version: "3.8"

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - database

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app

  database:
    build: ./database
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql_root_password
      MYSQL_DATABASE: marketplace
    ports:
      - "3306:3306"
    secrets:
      - mysql_root_password
    volumes:
      - db_data:/var/lib/mysql

secrets:
  mysql_root_password:
    external: true

volumes:
  db_data: